<header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
        <a routerLink="/taches" class="text-lg font-bold text-blue-600">
            Noto
        </a>
        <a routerLink="/dossiers" class="text-lg font-bold text-blue-600">
            Mes dossiers
        </a>

        <button
            (click)="onLogout()"
            class="flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-red-600 active:text-red-700 transition-colors px-3 py-2 rounded-md hover:bg-red-50"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            <span class="hidden sm:inline">Déconnexion</span>
        </button>
    </div>
</header>
