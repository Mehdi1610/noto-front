<div class="border-l-2 border-gray-200 pl-3">
    <div
        (click)="toggle()"
        class="flex items-center justify-between gap-2 py-2 px-2 rounded-md hover:bg-gray-50 cursor-pointer group"
    >
        <div class="flex items-center gap-2 min-w-0">
            @if (dossier.sousDossiers.length > 0) {
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4 flex-shrink-0 text-gray-400 transition-transform"
                    [class.rotate-90]="ouvert()"
                    fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            } @else {
                <span class="w-4 flex-shrink-0"></span>
            }

            <span class="w-2 h-2 rounded-full flex-shrink-0" [style.background-color]="dossier.couleur || '#9ca3af'"></span>

            <span
                class="font-medium text-gray-800 truncate hover:text-blue-600 hover:underline"
                (click)="onVoirDetail($event)"
            >{{ dossier.nom }}</span>

            @if (dossier.taches.length > 0) {
                <span class="text-xs text-gray-400 flex-shrink-0">({{ dossier.taches.length}})</span>
            }
        </div>

        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
            <button
                (click)="onAjouterSousDossier($event)"
                title="Ajouter un sous-dossier"
                class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            <button
                (click)="onSupprimer($event)"
                title="Supprimer"
                class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                </svg>
            </button>
        </div>
    </div>

    @if (ouvert() && dossier.sousDossiers.length > 0) {
        <div class="ml-2">
            @for (sousDossier of dossier.sousDossiers; track sousDossier.id) {
                <app-dossier-node
                    [dossier]="sousDossier"
                    (supprimer)="onSupprimerEnfant($event)"
                    (ajouterSousDossier)="onAjouterSousDossierEnfant($event)"
                />
            }
        </div>
    }
</div>
