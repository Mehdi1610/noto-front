<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8 sm:px-6 lg:px-8">
    <div class="w-full max-w-sm sm:max-w-md bg-white p-6 sm:p-8 rounded-lg shadow">
        <h1 class="text-xl sm:text-2xl font-bold mb-6 text-center">Créer un compte</h1>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                <input
                    type="text"
                    formControlName="username"
                    autocomplete="username"
                    class="w-full px-3 py-2.5 sm:py-2 text-base border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input
                    type="email"
                    formControlName="email"
                    autocomplete="email"
                    inputmode="email"
                    class="w-full px-3 py-2.5 sm:py-2 text-base border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input
                    type="password"
                    formControlName="password"
                    autocomplete="new-password"
                    class="w-full px-3 py-2.5 sm:py-2 text-base border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <p class="text-xs text-gray-500 mt-1">4 caractères minimum</p>
            </div>

            @if (errorMessage) {
                <p class="text-red-600 text-sm">{{ errorMessage }}</p>
            }

            <button
                type="submit"
                [disabled]="form.invalid || loading"
                class="w-full bg-blue-600 text-white py-3 sm:py-2 text-base font-medium rounded-md hover:bg-blue-700 active:bg-blue-800 disabled:opacity-50 transition-colors"
            >
                {{ loading ? 'Création...' : 'S\'inscrire' }}
            </button>
        </form>

        <p class="text-sm text-center mt-4 text-gray-600">
            Déjà un compte ?
            <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Se connecter</a>
        </p>
    </div>
</div>
