
    <div class="flex items-center justify-start gap-3 mb-6">
    <p class="text-gray-500 py-2 rounded-md text-sm font-medium uppercase shrink-0">
        Priorite :
    </p>

    <div class="flex items-center gap-2 flex-wrap">
        @for(priorite of [ 'BASSE' , 'MOYENNE' , 'HAUTE'] ; track priorite) {
           
            <button
                (click)="filtrerParPriorite(priorite)"
                class="py-1 px-3 rounded-md text-sm font-medium transition-all hover:opacity-80 cursor-pointer {{ prioriteCouleur(priorite) }}"
            [class.ring-2]="filtrePriorite() === priorite"
            [class.ring-offset-1]="filtrePriorite() === priorite"
            [class.ring-gray-400]="filtrePriorite() === priorite"
               >
                {{ priorite }}
            </button>
        }
    </div>
<!-- Date echeante + asc/desc-->
</div>
    @if (tachesAffichees().length === 0) {
        <p class="text-center text-gray-400 text-sm py-12">Aucune tâche.</p>
    } @else {
        <div>
            @for (tache of tachesAffichees(); track tache.id) {
                    @if(tacheEnEditionId() === tache.id){
                        <div class="py-2">
                            <app-tache-form
                                [tacheInitiale]="tache"
                                (modifier)="modifierTache(tache.id, $event)"
                                (annuler)="fermerEdition()"    
                            />
                        </div>
                    }
                    @else{
                    <app-tache-item
                        [tache]="tache"
                        [displayDossier]="displayDossier()"
                        (changerStatut)="changerStatutTache($event)"
                        (supprimer)="supprimerTache($event)"
                        (modifier)="ouvrirEdition($event)"
                    />
                    }
                }
        </div>
    }
