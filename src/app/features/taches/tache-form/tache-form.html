<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-gray-50 border border-gray-200 rounded-lg p-4 space-y-3">
    <input
        type="text"
        formControlName="titre"
        placeholder="Titre de la tâche"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
    />

    <textarea
        formControlName="description"
        placeholder="Description (optionnel)"
        rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"
    ></textarea>

    <div class="flex flex-col sm:flex-row gap-2">
        <input
            type="date"
            formControlName="dateEcheance"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        />

        <select
            formControlName="priorite"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
        >
            <option value="">Priorité...</option>
            <option value="BASSE">Basse</option>
            <option value="MOYENNE">Moyenne</option>
            <option value="HAUTE">Haute</option>
        </select>
    </div>

    <div class="flex gap-2">
        <button
            type="submit"
            [disabled]="form.invalid"
            class="flex-1 sm:flex-none bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700 disabled:opacity-50"
        >
            Ajouter
        </button>
        <button
            type="button"
            (click)="annuler.emit()"
            class="flex-1 sm:flex-none bg-gray-100 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-200"
        >
            Annuler
        </button>
    </div>
</form>
